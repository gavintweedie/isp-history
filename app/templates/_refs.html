{# Renders a list of refs; expects `refs` in context. Defense-in-depth:
   db.py rejects non-http(s) at load, but template also guards. #}
{% if refs %}
  {% for r in refs %}
    {% if is_safe_url(r.url) %}
      <a href="{{ r.url }}" target="_blank" rel="noopener" title="{{ r.label }}">{{ r.kind }}</a>
    {% else %}
      <span title="{{ r.label }}">{{ r.kind }}</span>
    {% endif %}
  {% endfor %}
{% endif %}
