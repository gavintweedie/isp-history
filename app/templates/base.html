<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Australian ISP Family Tree{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
  <header>
    <div class="brand"><a href="{{ url_for('index') }}">Australian ISP Family Tree</a></div>
    <nav>
      <a href="{{ url_for('index') }}">Graph</a>
      <a href="{{ url_for('directory') }}">Directory</a>
    </nav>
  </header>
  {% block tabs %}{% endblock %}
  <main class="{% block main_class %}{% endblock %}">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
